{% extends 'base.html' %}
{% load static %}

{% block title %}New Course — StudyPeak{% endblock %}
{% block nav_crm %}active{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/crm.css' %}">
{% endblock %}

{% block content %}
<div class="container-md">

    <div class="page-header">
        <div>
            <h1 class="page-title">New Course</h1>
            <p class="page-subtitle">Create a course for your students</p>
        </div>
        <a href="{% url 'course_list' %}" class="btn btn-secondary">
            <i class="fa-solid fa-arrow-left"></i> Back
        </a>
    </div>

    <div class="card">
        <form method="post">
            {% csrf_token %}

            <div class="form-group">
                <label class="form-label">Course Name <span class="text-danger">*</span></label>
                <input
                    type="text"
                    name="name"
                    class="form-input"
                    placeholder="e.g. Python Programming 2025"
                    value="{{ request.POST.name }}"
                    required
                    autofocus
                >
            </div>

            <div class="form-group">
                <label class="form-label">Description</label>
                <textarea
                    name="description"
                    class="form-input form-textarea"
                    rows="4"
                    placeholder="Describe what students will learn in this course..."
                >{{ request.POST.description }}</textarea>
            </div>

            <div class="form-actions mt-24">
                <button type="submit" class="btn btn-primary btn-lg">
                    <i class="fa-solid fa-plus"></i> Create Course
                </button>
                <a href="{% url 'course_list' %}" class="btn btn-secondary btn-lg">Cancel</a>
            </div>

        </form>
    </div>

</div>
{% endblock %}
